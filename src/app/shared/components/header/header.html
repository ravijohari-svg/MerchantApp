<header class="app-header">
  <div class="header-left">
    <button class="menu-toggle-btn" (click)="layoutService.toggleSidebar()" aria-label="Toggle Sidebar">
      <i class="pi pi-bars"></i>
    </button>

    <div class="search-bar">
      <i class="pi pi-search search-icon"></i>
      <input type="text" placeholder="Search orders, products, stores..." aria-label="Search" />
      <span class="search-shortcut">⌘K</span>
    </div>
  </div>

  <div class="header-right">
    <!-- <div class="role-selector">
      <i class="pi pi-user role-icon"></i>
      <span class="role-text">{{ currentRole }}</span>
      <i class="pi pi-chevron-down role-arrow"></i>
    </div> -->

    <button class="notification-btn" aria-label="Notifications">
      <i class="pi pi-bell"></i>
      <span class="bell-dot"></span>
    </button>

    <div class="user-profile">
      <div class="avatar-circle">{{ userProfile.initials }}</div>
      <div class="profile-info">
        <span class="profile-name">{{ userProfile.name }}</span>
        <span class="profile-role">{{ userProfile.role }}</span>
      </div>
    </div>
  </div>
</header>
